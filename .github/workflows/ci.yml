name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use Node.js 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify local and Cloudflare editions
        run: npm run verify

      - name: Rehearse a private-state-free Windows install
        shell: pwsh
        run: .\scripts\test-clean-install.ps1 -SkipTests

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --prefix cloudflare --audit-level=high
