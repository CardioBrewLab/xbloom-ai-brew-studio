name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Use Node.js 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm

      - name: Match tag to package version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version $version"
          }

      - name: Verify source
        run: |
          npm ci
          npm run verify
          .\scripts\test-clean-install.ps1 -SkipTests
          npm audit --audit-level=high
          npm audit --prefix cloudflare --audit-level=high

  publish:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The write-scoped job only archives the already-verified commit. It never
      # installs dependencies or executes repository scripts.
      - name: Check out verified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Create clean Windows package
        id: package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $base = "xbloom-ai-brew-studio-$tag-windows"
          $zip = Join-Path $env:RUNNER_TEMP "$base.zip"
          git archive --format=zip --prefix="$base/" --output="$zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
          $checksum = "$zip.sha256"
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($zip))" | Set-Content -LiteralPath $checksum -Encoding ascii
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = '${{ steps.package.outputs.zip }}'
          $checksum = '${{ steps.package.outputs.checksum }}'
          gh release create $tag $zip $checksum --verify-tag --generate-notes --title "xBloom AI Brew Studio $tag"
