<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="xBloom AI Brew Studio —— 用一句话，冲一杯懂你的咖啡。AI 手冲配方生成、曲线模拟与云端发布工作台。"
    />
    <meta name="theme-color" content="#FAFAF7" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 桌面端优先系统 UI 字体：本地直接渲染，不等待网络字体，中文字形与 Windows 缩放更稳定。 -->
    <title>xBloom AI Brew Studio</title>
    <script type="module">
      // 开发服务启动时移除同源旧版 PWA 壳缓存，避免历史 Service Worker 拦截 Vite 模块造成白屏。
      if (import.meta.env.DEV && "serviceWorker" in navigator) {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          if (registrations.length > 0) {
            await Promise.all(registrations.map((registration) => registration.unregister()));
            if ("caches" in window) {
              const cacheNames = await caches.keys();
              await Promise.all(
                cacheNames
                  .filter((cacheName) => cacheName.startsWith("xbloom-shell-"))
                  .map((cacheName) => caches.delete(cacheName)),
              );
            }

            const reloadKey = "xbloom-dev-sw-reset";
            if (sessionStorage.getItem(reloadKey) !== "done") {
              sessionStorage.setItem(reloadKey, "done");
              window.location.reload();
            }
          } else {
            sessionStorage.removeItem("xbloom-dev-sw-reset");
          }
        } catch {
          // 清理失败时继续加载主应用，保留正常开发链路。
        }
      }
    </script>
    <script>
      // 首屏渲染前应用已保存的主题，避免亮/暗闪烁（亮色默认）
      try {
        var t = localStorage.getItem("xbloom-theme");
        document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
