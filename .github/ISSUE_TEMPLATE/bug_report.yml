name: Bug 报告
description: 提交可复现的问题；日志和截图请先脱敏。
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请移除 API Key、Cookie、Token、邮箱、密码和本机绝对路径。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: v0.1.0 / commit SHA
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 与浏览器版本
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 发生在哪个模块
      options:
        - 安装或启动
        - 模型接口或生成
        - 联网调研
        - 小红书登录或搜索
        - xBloom 登录或上传
        - 豆仓、历史或反馈
        - 曲线、编辑或冲煮引导
        - BLE 实验
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. …\n2. …\n3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的日志或截图
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已检查内容中没有 Key、Cookie、Token、邮箱、密码或其他账号信息。
          required: true
